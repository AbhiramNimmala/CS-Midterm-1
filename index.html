<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>CS111 Midterm 1 Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F3F5F9; --paper:#FFFFFF; --ink:#17243A; --muted:#5A6A80; --line:#D8DFE8; --soft:#EEF2F7;
  --hl:#FFE14D; --hl-soft:#FFF5C2; --red:#BF3528; --red-soft:#FCE8E5; --green:#1E7A4B; --green-soft:#E0F3E8;
  --amber:#A86500; --amber-soft:#FDF0DA; --accent:#2446A8; --accent-soft:#E7EDFB; --cur:#FFF1A8;
  --kw:#2446A8; --str:#1E7A4B; --cm:#7A8698;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E141D; --paper:#151D29; --ink:#E3E9F2; --muted:#97A6B9; --line:#283446; --soft:#1C2635;
    --hl:#E9C930; --hl-soft:#3A3417; --red:#FF8175; --red-soft:#3A1E1B; --green:#6FD39D; --green-soft:#16301F;
    --amber:#F2B15A; --amber-soft:#3A2A12; --accent:#93B0FF; --accent-soft:#1B2745; --cur:#4A421A;
    --kw:#93B0FF; --str:#7ED7A4; --cm:#7F8DA2;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E141D; --paper:#151D29; --ink:#E3E9F2; --muted:#97A6B9; --line:#283446; --soft:#1C2635;
  --hl:#E9C930; --hl-soft:#3A3417; --red:#FF8175; --red-soft:#3A1E1B; --green:#6FD39D; --green-soft:#16301F;
  --amber:#F2B15A; --amber-soft:#3A2A12; --accent:#93B0FF; --accent-soft:#1B2745; --cur:#4A421A;
  --kw:#93B0FF; --str:#7ED7A4; --cm:#7F8DA2;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{font-size:14px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;line-height:1.3}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
button.big{font-size:16px;padding:11px 20px}
code{font-family:var(--mono);font-size:.88em;background:var(--soft);padding:1px 5px;border-radius:4px}
pre{font-family:var(--mono);font-size:13.5px;line-height:1.55;background:var(--soft);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:10px 0}
pre code{background:none;padding:0}
pre.code .kw,.codepane .kw,.bugcode .kw{color:var(--kw);font-weight:600}
pre.code .str,.codepane .str,.bugcode .str{color:var(--str)}
.cm{color:var(--cm)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.12}
h4{margin:16px 0 6px}
p,li{max-width:70ch}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tip{border-left:4px solid var(--hl);background:var(--hl-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.trap{border-left:4px solid var(--red);background:var(--red-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0}
.rule{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rule h4{margin:0 0 4px;font-size:15px}.rule p{margin:0;font-size:14.5px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:19px;background:none;border:0;padding:0;display:flex;gap:8px;align-items:center}
.brand i{font-style:normal;background:var(--hl);color:#17243A;border-radius:6px;padding:0 6px;font-size:14px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
#cd{font-family:var(--mono);color:var(--ink);font-weight:600}
.tprog{display:flex;align-items:center;gap:8px}
#topProg{width:120px;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
#topProg span{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
#lessonSel{display:none;max-width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper)}

.shell{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;max-width:1320px;margin:0 auto}
#side{position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow-y:auto;padding:16px 12px 40px 16px;border-right:1px solid var(--line)}
#side nav{display:flex;flex-direction:column;gap:4px}
.navh,.navl{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;width:100%}
.navh{font-weight:700;margin:6px 0}
.navl .nn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--mono);font-size:12px}
.navl .nt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.navl small{display:block;color:var(--muted);font-size:12px}
.navl .np{flex:none;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--green) var(--p),var(--line) 0);display:grid;place-items:center;font-size:11px;color:var(--paper);font-weight:700}
.navl.on,.navh.on{background:var(--paper);border-color:var(--line)}
.navl.on .nn{background:var(--ink);color:var(--bg)}
#main{padding:24px 28px 80px;min-width:0}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  #side{display:none}
  #lessonSel{display:block;width:100%}
  #main{padding:16px 16px 90px}
  #topProg{width:70px}
}

/* home */
.hero{padding:10px 0 20px}
.hero h1{font-size:clamp(32px,5.4vw,52px);margin:8px 0 10px}
.hero h1 mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;padding:0 3px}
.lede{color:var(--muted);max-width:64ch;margin:0 0 18px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:150px;flex:1 1 150px}
.stats b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.home section{padding-top:24px;border-top:1px solid var(--line);margin-top:24px}
.home h2{font-size:26px;margin:0 0 6px}
.pday h3{font-size:17px;margin:18px 0 8px}
.prow{display:grid;grid-template-columns:86px minmax(0,1fr) 120px;gap:12px;align-items:center;width:100%;text-align:left;margin:6px 0;padding:10px 14px;border-radius:12px}
.prow.now{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.prow.now .pt::after{content:"NOW";display:block;font-size:10px;letter-spacing:.08em;color:var(--bg);background:var(--ink);border-radius:4px;width:max-content;padding:0 5px;margin-top:3px}
.pt{font-family:var(--mono);font-size:13px;color:var(--muted)}
.pl b{display:block;font-size:15px}.pl small{color:var(--muted);font-size:12.5px}
.pp{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:flex-end}
.pbar{width:56px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:inline-block}
.pbar span{display:block;height:100%;background:var(--green)}
@media (max-width:560px){.prow{grid-template-columns:70px minmax(0,1fr)}.pp{grid-column:2;justify-content:flex-start}}
.revchips{display:flex;flex-wrap:wrap;gap:6px}
.revchip{font-size:13px;border-color:var(--amber);background:var(--amber-soft)}
.revchip.shown{border-color:var(--red);background:var(--red-soft)}

/* lesson */
.lhead .lt{font-size:clamp(26px,4vw,36px);margin:6px 0 12px}
.mscore{display:inline-block;font-family:var(--mono);font-size:13px;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:6px;margin-bottom:10px}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.dot{width:22px;height:22px;padding:0;border-radius:6px;background:var(--paper);border:1.5px solid var(--line)}
.dot.rd{border-radius:50%}
.dot.cur{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.dot.d1{background:var(--green);border-color:var(--green)}
.dot.d2{background:var(--amber);border-color:var(--amber)}
.dot.d3{background:var(--red);border-color:var(--red)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;max-width:980px}
.card h2{font-size:26px;margin:4px 0 12px}
.kind{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;gap:10px}
.kind .cn{color:var(--muted)}
.card .body>p:first-child{margin-top:0}
.qp{font-size:17px;margin:6px 0 10px}
.qform{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.qin{font-family:var(--mono);font-size:16px;padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);flex:1 1 200px;min-width:0}
.mc{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:15px;padding:10px 14px;border-radius:10px}
.opt .ol{font-family:var(--mono);font-weight:700;color:var(--muted)}
.opt.right{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red);opacity:1;text-decoration:line-through;text-decoration-color:var(--red)}
.fb{min-height:1.4em;margin:10px 0;border-radius:10px}
.fb.ok,.fb.no,.fb.shown,.fb.prev{padding:10px 14px}
.fb.ok{background:var(--green-soft);border-left:4px solid var(--green)}
.fb.no{background:var(--red-soft);border-left:4px solid var(--red)}
.fb.shown{background:var(--amber-soft);border-left:4px solid var(--amber)}
.fb.prev{background:var(--soft);color:var(--muted);font-size:14px}
.qact{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ai-btn{display:none;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
body.ai-on .ai-btn{display:inline-block}
.ai-btn[hidden]{display:none!important}
.ai-out{white-space:pre-wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.thinking{color:var(--muted);font-style:italic}
.lnav{display:flex;justify-content:space-between;gap:10px;max-width:980px;margin-top:16px;flex-wrap:wrap}
.lnav button{padding:10px 18px;font-size:15px}
.boxes{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.vbox{border:2px solid var(--ink);border-radius:8px;min-width:84px;text-align:center;overflow:hidden}
.vbox span{display:block;font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--bg);padding:2px 8px}
.vbox b{display:block;font-family:var(--mono);font-size:22px;padding:6px 10px}

/* stepper */
.stepper{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0;background:var(--bg)}
.st-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.inlabel,.snip{font-size:13px;color:var(--muted)}
.cmdline{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:14px;flex:1 1 260px;min-width:0}
.cmdline span{white-space:nowrap}
.st-in{font-family:var(--mono);font-size:14px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);flex:1 1 140px;min-width:0}
.st-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr)}
@media (max-width:720px){.st-grid{grid-template-columns:1fr}}
.codepane{font-family:var(--mono);font-size:13.5px;line-height:1.7;padding:8px 0;overflow:auto;max-height:430px;background:var(--paper);border-right:1px solid var(--line)}
.ln{display:grid;grid-template-columns:34px 0 minmax(0,1fr);white-space:pre;padding-right:10px;border-left:4px solid transparent}
.codepane.with-ops .ln{grid-template-columns:34px 30px minmax(0,1fr)}
.ln .no{color:var(--muted);text-align:right;padding-right:10px;user-select:none;font-size:12px}
.ln .lo{overflow:hidden;text-align:center;color:var(--accent);font-weight:700;font-size:12px}
.codepane.with-ops .ln .lo{background:var(--accent-soft)}
.ln .tx{overflow-x:visible}
.ln.cur{background:var(--cur);border-left-color:var(--ink)}
.ln.errl{background:var(--red-soft);border-left-color:var(--red)}
.st-side{display:flex;flex-direction:column;background:var(--bg)}
.panel{padding:10px 12px;border-bottom:1px solid var(--line)}
.panel h5{margin:0 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mem table{min-width:0;width:100%;font-family:var(--mono);font-size:13px}
.mem td,.mem th{padding:3px 8px}
.mem .ty{color:var(--kw);font-size:12px}
.mem tr.chg td{background:var(--hl-soft)}
.mem tr.chg .v{font-weight:700}
.empty{font-size:13px;color:var(--muted);font-style:italic}
.outp{margin:0;min-height:2.2em;background:#0F1722;color:#D6F5E3;font-size:13px;padding:8px 10px;white-space:pre-wrap}
.opsn{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.st-note{padding:12px 14px;border-top:1px solid var(--line);background:var(--paper);font-size:15px;min-height:3.2em}
.st-note.err{background:var(--red-soft)}
.st-note.done{background:var(--green-soft)}
.opnote{color:var(--accent);font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.predict{padding:12px 14px;border-top:2px solid var(--ink);background:var(--hl-soft)}
.predict .tag{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prow form,.predict form{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pin{font-family:var(--mono);font-size:15px;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);flex:1 1 150px;min-width:0}
.pfb{margin-top:8px}.pfb.ok{color:var(--green);font-weight:700}.pfb.no{color:var(--red)}
.pfb .cont{margin-left:6px}
.st-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--paper)}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--ink)}
.stepn{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}

/* write + bug */
.tests td.res{font-family:var(--mono);font-size:13px;white-space:nowrap}
.res.ok{color:var(--green);font-weight:700}.res.no{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 6px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:6px;background:var(--soft)}
.editor{width:100%;font-family:var(--mono);font-size:14px;line-height:1.6;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical;tab-size:4}
.rub{font-size:14px;color:var(--muted)}
.bugcode{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--paper);margin:10px 0}
.bl{display:grid;grid-template-columns:34px minmax(0,1fr);text-align:left;font-family:var(--mono);font-size:13.5px;white-space:pre;border:0;border-left:4px solid transparent;border-radius:0;padding:3px 10px 3px 0;background:transparent}
.bl .no{color:var(--muted);text-align:right;padding-right:10px;font-size:12px}
.bl:hover{background:var(--soft)}
.bl.sel{background:var(--amber-soft);border-left-color:var(--amber)}
.bl.isbug{background:var(--red-soft);border-left-color:var(--red)}
.bl.isbug.sel{background:var(--green-soft);border-left-color:var(--green)}
.bl.extra{text-decoration:line-through}
.bugex li{margin:4px 0}
.drill .dexpr{font-family:var(--mono);font-size:clamp(20px,4vw,28px);padding:14px 0;word-break:break-all}
.dscore{font-family:var(--mono);font-size:13px;color:var(--muted)}
.cheat .lt{font-size:34px;margin:6px 0 14px}

/* tutor */
#tutorBtn{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;padding:12px 18px;border-radius:999px;background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
body.ai-on #tutorBtn{display:block}
#tutor{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:min(420px,calc(100vw - 32px));height:min(560px,calc(100vh - 140px));background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);display:flex;flex-direction:column;overflow:hidden}
#tutor[hidden]{display:none}
.th{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.th b{font-family:var(--display);font-size:17px}
.th small{display:block;color:var(--muted);font-size:12px}
#tlog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{white-space:pre-wrap;padding:9px 12px;border-radius:12px;font-size:14.5px;max-width:92%}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg)}
.msg.bot{align-self:flex-start;background:var(--accent-soft)}
#tform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#tin{flex:1;min-width:0;resize:none;height:44px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:14.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="topbar">
  <button class="brand" id="homeBtn" type="button"><i>CS111</i> Midterm 1 Kit</button>
  <div class="tb-right">
    <span>⏳ <span id="cd">…</span></span>
    <span class="tprog"><span id="topProg" aria-hidden="true"><span></span></span><span id="topPct">0%</span></span>
  </div>
  <select id="lessonSel" aria-label="Go to lesson"></select>
</header>
<div class="shell">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<button id="tutorBtn" type="button">✦ Ask the tutor</button>
<div id="tutor" hidden role="dialog" aria-label="Claude tutor">
  <div class="th"><div><b>Tutor</b><small>Knows which card you're on. Ask anything.</small></div><button type="button" id="tclose" aria-label="Close tutor">✕</button></div>
  <div id="tlog"><div class="msg bot">Hi! I can see the card you're on. Ask me things like "why is 7 / 2 equal to 3?", "walk me through line 5", or "give me another practice problem like this one."</div></div>
  <form id="tform"><textarea id="tin" placeholder="Ask a question…" aria-label="Your question"></textarea><button type="submit" class="primary">Send</button></form>
</div>
<script>
/* ===== Pseudocode engine: tokenizer, parser, interpreter, op counter, test runner ===== */
(function (G) {

  L.push({ id: "l5", title: "WHILE loops & trace tables", sec: "Exam Section 2", mins: 90, steps: [
    R("How a WHILE loop runs", `<pre>SET i TO 1                ← 1. start value
WHILE (i &lt;= 3)            ← 2. check
    DISPLAY i             ← 3. body
    ADD 1 TO i            ← 4. update (without it: infinite loop)
ENDWHILE</pre>
      <p>The loop <b>checks</b> the condition. True → run the body, then go back up and check again. False → jump to the line after ENDWHILE.</p>
      <p><b>Key fact:</b> the check runs <b>one more time than the body</b>. The last check is the one that comes out false and ends the loop. That +1 is half of counting operations (Lesson 6).</p>`),
    TR("SET i TO 1\nWHILE (i <= 3)\n    DISPLAY i\n    ADD 1 TO i\nENDWHILE", "", "Watch the loop", "Watch the highlight jump back up to WHILE after each ADD. Count how many times line 2 is checked.", { quiz: true, showOps: true }),
    Q({ p: "In that loop, how many times was the condition <code>i &lt;= 3</code> checked?", mode: "num", a: ["4"], hint: "i was 1, 2, 3, and then…?", exp: "Checked with i = 1, 2, 3 (true) and i = 4 (false). 4 checks, 3 body runs.", miss: { "3": "The body ran 3 times, but there's one more check, with i = 4, that comes out false and ends the loop." } }),

  /* ---------------- LESSON 6 ---------------- */
  L.push({ id: "l6", title: "Counting operations", sec: "Exam Section 2", mins: 75, steps: [
    R("The counting rules", `<div class="tablewrap"><table><tr><th>Line</th><th>Counts as</th></tr>
      <tr><td>READ, DISPLAY, SET, COMPUTE, ADD, SUBTRACT</td><td><b>1</b> each time it runs</td></tr>
      <tr><td>IF</td><td><b>1 per comparison</b> each time it's checked (<code>A AND B</code> = 2)</td></tr>
      <tr><td>WHILE</td><td>1 per check. Checks = <b>iterations + 1</b></td></tr>
      <tr><td>ELSE, ENDIF, ENDWHILE, HALT</td><td><b>0</b> (the exam tables say "write 0")</td></tr></table></div>
      <h4>Method</h4><ol><li>List the loop variable's values. Count how many pass: that's <b>k</b>, the iterations.</li><li>WHILE line = <b>k + 1</b>. Each body line = <b>k</b>. A line inside an IF only counts when the IF is true (call that <b>x</b>).</li><li>Add the one-time lines outside the loop.</li><li><b>Always check</b> your formula against the specific n.</li></ol>
      <div class="tip">Iteration shortcuts: from 1 while <code>i &lt;= n</code> → n. From 0 while <code>i &lt; n</code> → n. From 1 while <code>i &lt; n</code> → n − 1. Subtracting d while <code>d &lt;= n</code> → n / d.</div>`),

      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") runB.click(); });

    }
    root.appendChild(top);
    var grid = el("div", "st-grid");

    pane.innerHTML = lines.map(function (l, i) { return '<div class="ln" data-l="' + (i + 1) + '"><span class="no">' + (i + 1) + '</span><span class="lo"></span><span class="tx">' + (hl(l, java ? "java" : "pc") || "&nbsp;") + "</span></div>"; }).join("");
    grid.appendChild(pane);
    var side = el("div", "st-side");
    side.innerHTML = '<div class="panel"><h5>Memory</h5><div class="mem"></div></div><div class="panel"><h5>Output</h5><pre class="outp"></pre></div>' + (java ? "" : '<div class="panel ops"><h5>Operations so far</h5><div class="opsn">0</div></div>');
    grid.appendChild(side);
    root.appendChild(grid);
    var note = el("div", "st-note"); root.appendChild(note);

    var ctrl = el("div", "st-ctrl");
    ctrl.innerHTML = '<button type="button" data-a="reset">⟲ Restart</button><button type="button" data-a="back">◂ Back</button><button type="button" class="primary" data-a="next">Next ▸</button><button type="button" data-a="end">Run to end</button>' +
      '<label class="tog"><input type="checkbox" data-t="quiz"' + (quiz ? " checked" : "") + "> Quiz me</label>" + (java ? "" : '<label class="tog"><input type="checkbox" data-t="ops"' + (showOps ? " checked" : "") + "> Ops per line</label>") + '<span class="stepn"></span>';

    ctrl.addEventListener("click", function (e) {

    ctrl.addEventListener("change", function (e) {

    function compute() {
      if (java) { snaps = JAVA.run(cfg.key, inp ? inp.value.trim().split(/\s+/).filter(Boolean) : null); return; }

    var aiB = aiBtn("Explain my mistake"); aiB.hidden = true;

    var lastWrong = "";

      if (isNumStr(g) && isNumStr(exp) && exp.indexOf(".") < 0 && g.indexOf(".") >= 0 && Math.trunc(parseFloat(g)) === parseFloat(exp)) return "Both numbers are ints, so the division chops off the decimal.";

    function reveal() {
      checked = true;
      box.querySelectorAll(".bl").forEach(function (b, i) { var n = i + 1; b.classList.toggle("isbug", bugLines.indexOf(n) >= 0); b.classList.toggle("miss", bugLines.indexOf(n) >= 0 && !sel[n]); b.classList.toggle("extra", bugLines.indexOf(n) < 0 && !!sel[n]); });
      ex.innerHTML = "<h4>The bugs</h4><ul>" + bugLines.map(function (n) { return "<li><b>Line " + n + ":</b> " + st.bugs[n] + "</li>"; }).join("") + "</ul><h4>Fixed</h4>" + codeBlock(st.fixed, "java");
    }
    chk.onclick = function () {
      var picked = Object.keys(sel).filter(function (n) { return sel[n]; }).map(Number);
      var found = bugLines.filter(function (n) { return picked.indexOf(n) >= 0; }), extra = picked.filter(function (n) { return bugLines.indexOf(n) < 0; });
      if (found.length === bugLines.length && !extra.length) { fb.className = "fb ok"; fb.innerHTML = "<b>✓ You found every buggy line.</b> Now read what's wrong with each one, because the exam asks you to name the fix."; mark(k, 1); reveal(); }
      else { fb.className = "fb no"; fb.innerHTML = "<b>You found " + found.length + " of " + bugLines.length + " buggy lines.</b>" + (extra.length ? " Line" + (extra.length > 1 ? "s " : " ") + extra.join(", ") + (extra.length > 1 ? " are" : " is") + " actually fine." : "") + " Run the checklist from the first card: declared types? semicolons? loop bounds? a stray ;? Change your picks and check again."; }
    };
    rev.onclick = function () { if (!S.done[k]) mark(k, 3); fb.className = "fb shown"; fb.innerHTML = ""; reveal(); };
  }

  function renderDrill(card, k) {
    card.insertAdjacentHTML("beforeend", '<h2>Expression drill</h2><p class="muted">Type what Java would print. Leave out quotes for Strings (for <code>"5" + 5</code> type <code>55</code>). Doubles need their <code>.0</code>. Goal: 15 correct.</p>');
    var d = el("div", "drill"); card.appendChild(d);
    d.innerHTML = '<div class="dexpr"></div><form class="qform"><input type="text" class="qin" autocomplete="off" spellcheck="false" aria-label="What Java prints"><button type="submit" class="primary">Check</button><button type="button" class="nextq">Next</button></form><div class="fb" aria-live="polite"></div><div class="dscore"></div>';
    var order = [], pos = 0, answered = false, ex = d.querySelector(".dexpr"), inp = d.querySelector(".qin"), fb = d.querySelector(".fb"), sc = d.querySelector(".dscore");
    function shuffle() { order = DRILL.map(function (_, i) { return i; }); for (var i = order.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = order[i]; order[i] = order[j]; order[j] = t; } pos = 0; }
    function score() { sc.textContent = "Correct: " + S.drill.right + " / " + S.drill.tries + (S.drill.right >= 15 ? "   ✓ goal reached" : "   (goal: 15)"); }
    function show() { if (pos >= order.length) shuffle(); ex.textContent = DRILL[order[pos]][0]; inp.value = ""; fb.className = "fb"; fb.innerHTML = ""; answered = false; score(); }
    d.querySelector("form").onsubmit = function (e) {
      e.preventDefault(); if (answered) { pos++; show(); inp.focus(); return; }
      var q = DRILL[order[pos]], v = inp.value; if (!v.trim()) return;
      answered = true; S.drill.tries++;
      if (norm("java", v) === norm("java", q[1])) { S.drill.right++; fb.className = "fb ok"; fb.innerHTML = "<b>✓ Correct.</b> " + esc(q[2]); }
      else { var m = autoMiss({ a: [q[1]], mode: "java" }, v); fb.className = "fb no"; fb.innerHTML = "<b>✗ Java prints " + esc(q[1]) + ".</b> " + (m ? m + " " : "") + esc(q[2]); }
      if (S.drill.right >= 15) mark(k, 1);
      save(); score();
    };
    d.querySelector(".nextq").onclick = function () { pos++; show(); inp.focus(); };
    shuffle(); show();
  }

  /* ---------- Views ---------- */
  var main, side, view = { name: "home", li: 0, si: 0 };
  function lessonStats(li) {
    var L = LESSONS[li], n = L.steps.length, d = 0;
    L.steps.forEach(function (st, si) { var k = stepKey(li, si); if (S.done[k] || (st.t === "read" && S.seen[k])) d++; });
    return { d: d, n: n, pct: Math.round(100 * d / n) };
  }
  function overall() { var d = 0, n = 0; LESSONS.forEach(function (_, li) { var s = lessonStats(li); d += s.d; n += s.n; }); return { d: d, n: n, pct: Math.round(100 * d / n) }; }
  function refreshProgress() {
    var o = overall(); var p = $("#topProg"); if (p) { p.querySelector("span").style.width = o.pct + "%"; $("#topPct").textContent = o.pct + "%"; }
    renderSide();
  }
  function renderSide() {
    if (!side) return;
    side.innerHTML = '<nav aria-label="Lessons"><button class="navh' + (view.name === "home" ? " on" : "") + '" data-v="home" type="button">⌂ Plan &amp; progress</button>' + LESSONS.map(function (L, li) {
      var s = lessonStats(li);
      return '<button type="button" class="navl' + (view.name === "lesson" && view.li === li ? " on" : "") + '" data-li="' + li + '"><span class="nn">' + (li + 1) + '</span><span class="nt">' + esc(L.title) + '<small>' + esc(L.sec) + " · ~" + L.mins + ' min</small></span><span class="np" style="--p:' + s.pct + '%" title="' + s.pct + '% done">' + (s.pct === 100 ? "✓" : "") + "</span></button>";
    }).join("") + '<button class="navh' + (view.name === "cheat" ? " on" : "") + '" data-v="cheat" type="button">≡ Cheat sheet</button></nav>';
    var sel = $("#lessonSel");
    if (sel) sel.innerHTML = '<option value="home">⌂ Plan & progress</option>' + LESSONS.map(function (L, li) { return '<option value="' + li + '"' + (view.name === "lesson" && view.li === li ? " selected" : "") + ">" + (li + 1) + ". " + esc(L.title) + " (" + lessonStats(li).pct + "%)</option>"; }).join("") + '<option value="cheat"' + (view.name === "cheat" ? " selected" : "") + ">≡ Cheat sheet</option>";
    if (sel && view.name === "home") sel.value = "home";
  }
  function go(v) { view = v; if (v.name === "lesson") { S.last = { li: v.li, si: v.si }; save(); } render(); window.scrollTo({ top: 0 }); }

  function render() {
    renderSide();
    main.innerHTML = "";
    if (view.name === "home") return renderHome();
    if (view.name === "cheat") return renderCheat();
    renderLesson();
  }

  var PLAN = [
    { day: "Saturday, Sep 26", items: [["12:30 PM", 0], ["1:30 PM", 1], ["2:30 PM", 2], ["4:15 PM", 3], ["7:00 PM", 4], ["8:45 PM", 5]] },
    { day: "Sunday, Sep 27", items: [["9:00 AM", 6], ["10:15 AM", 7], ["11:30 AM", 8], ["2:00 PM", 9], ["3:15 PM", 10], ["5:00 PM", 11], ["8:00 PM", "review"]] }
  ];
  function planDate(day, t) { var d = day.indexOf("26") > 0 ? "2026-09-26" : "2026-09-27"; var m = /(\d+):(\d+) (AM|PM)/.exec(t), h = +m[1] % 12 + (m[3] === "PM" ? 12 : 0); return new Date(d + "T" + String(h).padStart(2, "0") + ":" + m[2] + ":00-04:00"); }
  function countdown() { var ms = DEADLINE - new Date(); if (ms <= 0) return "Deadline reached"; var h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000); return h + "h " + m + "m left"; }
  function reviewList() {
    var out = [];
    LESSONS.forEach(function (L, li) { L.steps.forEach(function (st, si) { var v = S.done[stepKey(li, si)]; if (v === 2 || v === 3) out.push({ li: li, si: si, v: v, label: st.h || strip(st.p || "").slice(0, 70) }); }); });
    return out;
  }
  function renderHome() {
    var o = overall(), now = new Date();
    var cont = S.last ? S.last : firstIncomplete();
    var h = el("div", "home");
    h.innerHTML = '<div class="hero"><div class="eyebrow">Rutgers CS111 · Midterm 1</div><h1>From zero to <mark>exam-ready</mark></h1><p class="lede">Twelve lessons, from what a variable is to a full mock midterm, built from your notes, your review sheet and the F24, S25, F25 and S26 exams. Every line of code can be stepped through, and every answer is checked right away.</p>' +
      '<div class="stats"><div><b>' + countdown() + '</b><span>until Sunday 11:59 PM</span></div><div><b>' + o.pct + '%</b><span>complete (' + o.d + " of " + o.n + ' cards)</span></div><div><b>' + reviewList().length + '</b><span>cards to review</span></div></div>' +
      '<button type="button" class="primary big" id="contBtn">' + (S.last ? "Continue: Lesson " + (cont.li + 1) + " ▸" : "Start Lesson 1 ▸") + "</button></div>";
    var plan = el("section", "plan");
    plan.innerHTML = "<h2>Your schedule</h2><p class=\"muted\">Each block is one sitting. Take the breaks between them. The current block is highlighted.</p>";
    var allItems = []; PLAN.forEach(function (d) { d.items.forEach(function (it) { allItems.push({ day: d.day, t: it[0], what: it[1], at: planDate(d.day, it[0]) }); }); });
    PLAN.forEach(function (d) {
      var g = el("div", "pday"); g.innerHTML = "<h3>" + d.day + "</h3>";
      d.items.forEach(function (it) {
        var at = planDate(d.day, it[0]), i = allItems.findIndex(function (x) { return x.at.getTime() === at.getTime(); }), nextAt = allItems[i + 1] ? allItems[i + 1].at : DEADLINE;
        var isNow = now >= at && now < nextAt;
        var row = el("button", "prow" + (isNow ? " now" : "")); row.type = "button";
        if (it[1] === "review") { row.innerHTML = '<span class="pt">' + it[0] + '</span><span class="pl"><b>Final review</b><small>Redo every card in your review list, read the cheat sheet, sleep</small></span><span class="pp">' + reviewList().length + " to redo</span>"; row.onclick = function () { var r = reviewList()[0]; if (r) go({ name: "lesson", li: r.li, si: r.si }); else go({ name: "cheat" }); }; }
        else { var L = LESSONS[it[1]], s = lessonStats(it[1]); row.innerHTML = '<span class="pt">' + it[0] + '</span><span class="pl"><b>' + (it[1] + 1) + ". " + esc(L.title) + "</b><small>" + esc(L.sec) + " · ~" + L.mins + ' min</small></span><span class="pp"><span class="pbar"><span style="width:' + s.pct + '%"></span></span>' + s.pct + "%</span>"; row.onclick = function () { go({ name: "lesson", li: it[1], si: resumeStep(it[1]) }); }; }
        g.appendChild(row);
      });
      plan.appendChild(g);
    });
    h.appendChild(plan);
    var rv = reviewList();
    var rs = el("section", "reviewsec");
    rs.innerHTML = "<h2>Your review list</h2>" + (rv.length ? '<p class="muted">Cards where you needed a hint or looked at the answer. Redo these Sunday night.</p>' : '<p class="muted">Empty so far. Any card where you need a hint or reveal the answer shows up here.</p>');
    var chips = el("div", "revchips");
    rv.slice(0, 40).forEach(function (r) { var b = el("button", "revchip" + (r.v === 3 ? " shown" : ""), "L" + (r.li + 1) + " · " + esc(r.label)); b.type = "button"; b.onclick = function () { go({ name: "lesson", li: r.li, si: r.si }); }; chips.appendChild(b); });
    rs.appendChild(chips); h.appendChild(rs);
    var ex = el("section", "examsec");
    ex.innerHTML = '<h2>What the exam looks like</h2><div class="tablewrap"><table><tr><th>Section</th><th class="num">Pts</th><th>Every time</th><th>Lessons</th></tr>' +
      "<tr><td>1 · Pseudocode + conditionals</td><td class=\"num\">25</td><td>Trace for 2–3 inputs, max/min operations, write an algorithm</td><td>1–4</td></tr>" +
      "<tr><td>2 · Pseudocode + loops</td><td class=\"num\">25–30</td><td>Trace table, ops per line (specific n and any n), fill-in blanks, what does it do?</td><td>5–6</td></tr>" +
      "<tr><td>3 · Basic Java</td><td class=\"num\">40–50</td><td>Expression table, types, Math.random, javac/java, write a short program</td><td>7–8</td></tr>" +
      "<tr><td>4 · Conditionals &amp; loops</td><td class=\"num\">40</td><td>Output for given args, boolean expressions, decision trees, loop output</td><td>9–10</td></tr>" +
      "<tr><td>5 · Debugging</td><td class=\"num\">~20</td><td>Find the compile error, list the logic fixes, rewrite correctly</td><td>11</td></tr></table></div>";
    h.appendChild(ex);
    main.appendChild(h);
    $("#contBtn").onclick = function () { go({ name: "lesson", li: cont.li, si: cont.si }); };
  }
  function firstIncomplete() { for (var li = 0; li < LESSONS.length; li++) { var s = lessonStats(li); if (s.pct < 100) return { li: li, si: resumeStep(li) }; } return { li: 0, si: 0 }; }
  function resumeStep(li) { var L = LESSONS[li]; for (var si = 0; si < L.steps.length; si++) { var k = stepKey(li, si); if (!S.done[k] && !(L.steps[si].t === "read" && S.seen[k])) return si; } return 0; }

  function renderLesson() {
    var li = view.li, si = view.si, L = LESSONS[li], st = L.steps[si], k = stepKey(li, si);
    if (st.t === "read" && !S.seen[k]) { S.seen[k] = 1; save(); setTimeout(refreshProgress, 0); }
    var head = el("div", "lhead");
    var mockScore = "";
    if (L.mock) { var tot = 0, first = 0; L.steps.forEach(function (x, i) { if (x.t !== "read") { tot++; if (S.done[stepKey(li, i)] === 1) first++; } }); mockScore = '<span class="mscore">Mock score: ' + first + " / " + tot + " right on the first try</span>"; }
    head.innerHTML = '<div class="eyebrow">Lesson ' + (li + 1) + " of " + LESSONS.length + " · " + esc(L.sec) + "</div><h1 class=\"lt\">" + esc(L.title) + "</h1>" + mockScore;
    var dots = el("div", "dots");
    L.steps.forEach(function (x, i) {
      var kk = stepKey(li, i), v = S.done[kk], d = el("button", "dot" + (i === si ? " cur" : "") + (v === 1 ? " d1" : v === 2 ? " d2" : v === 3 ? " d3" : x.t === "read" && S.seen[kk] ? " d1" : "") + (x.t === "read" ? " rd" : ""));
      d.type = "button"; d.title = "Card " + (i + 1) + ": " + (x.h || strip(x.p || "").slice(0, 50) || (x.t === "drill" ? "Expression drill" : "")); d.setAttribute("aria-label", d.title);
      d.onclick = function () { go({ name: "lesson", li: li, si: i }); };
      dots.appendChild(d);
    });
    head.appendChild(dots);
    main.appendChild(head);
    var card = el("article", "card t-" + st.t);
    var kind = { read: "Learn", q: "Check yourself", trace: "Step through", jtrace: "Step through (Java)", write: "Write it", bug: "Find the bugs", drill: "Drill" }[st.t];
    card.appendChild(el("div", "kind", kind + ' <span class="cn">Card ' + (si + 1) + " of " + L.steps.length + "</span>"));
    if (st.t === "read") { card.appendChild(el("h2", "", esc(st.h))); card.appendChild(el("div", "body", st.html)); }
    else if (st.t === "q") renderQ(card, st, k);
    else if (st.t === "trace" || st.t === "jtrace") {
      card.appendChild(el("h2", "", esc(st.h)));
      var host = el("div", ""); card.appendChild(host);
      Stepper(host, st.t === "jtrace" ? { lang: "java", key: st.key, intro: st.intro, quiz: false } : { lang: "pc", code: st.code, inputs: st.inputs, intro: st.intro, quiz: st.quiz, showOps: st.showOps }, function () { mark(k, 1); });
    }
    else if (st.t === "write") { card.appendChild(el("h2", "", esc(st.h))); renderWrite(card, st, k); }
    else if (st.t === "bug") { card.appendChild(el("h2", "", esc(st.h))); renderBug(card, st, k); }
    else if (st.t === "drill") renderDrill(card, k);
    main.appendChild(card);
    var nav = el("div", "lnav");
    var back = el("button", "", "◂ Back"); back.type = "button"; back.disabled = si === 0 && li === 0;
    back.onclick = function () { if (si > 0) go({ name: "lesson", li: li, si: si - 1 }); else if (li > 0) go({ name: "lesson", li: li - 1, si: LESSONS[li - 1].steps.length - 1 }); };
    var nx = el("button", "primary", si < L.steps.length - 1 ? "Next ▸" : li < LESSONS.length - 1 ? "Next lesson: " + esc(LESSONS[li + 1].title) + " ▸" : "Finish ▸"); nx.type = "button";
    nx.onclick = function () { if (si < L.steps.length - 1) go({ name: "lesson", li: li, si: si + 1 }); else if (li < LESSONS.length - 1) go({ name: "lesson", li: li + 1, si: 0 }); else go({ name: "home" }); };
    nav.appendChild(back); nav.appendChild(nx);
    main.appendChild(nav);
  }

  function renderCheat() {
    var c = el("div", "cheat");
    c.innerHTML = '<div class="eyebrow">Read twice Sunday night</div><h1 class="lt">Cheat sheet</h1><div class="rules">' + [
      ["Assignment", "Right side first with current values, then store. COMPUTE x AS x + 3 means new x = old x + 3."],
      ["Integer vs double", "int/int chops: 7/2 = 3. Any double → double with .0: 2 + 3.0 = 5.0. (double)9/2 = 4.5 but (double)(9/2) = 4.0."],
      ["Modulus", "Remainder. Even: n%2 == 0. Divisible: n%k == 0. Last digit n%10, drop a digit n/10. Small % big = small. −7 % 2 = −1."],
      ["Order", "( ) first, then * / % left to right, then + − left to right."],
      ["Strings", "Left to right. Once a String appears, + glues: 1+2+\"3\" = \"33\"; \"3\"+1+2 = \"312\"."],
      ["Ranges", "Inside a range: AND. Outside (errors): OR. \"Not greater than\" = <=. Test the exact boundary values."],
      ["Writing pseudocode", "READ all → error check + HALT → nested IF/ELSE → exactly one DISPLAY per path → every ENDIF → test with the given examples."],
      ["Discounts", "20% off → × 0.8. 10% off → × 0.9. Percent p of x → x * p / 100.0."],
      ["Counting ops", "READ/DISPLAY/SET/COMPUTE/ADD/SUBTRACT = 1. IF = 1 per comparison. WHILE = iterations + 1. ELSE/ENDIF/ENDWHILE/HALT = 0. Check your formula at the specific n."],
      ["Iterations", "1..≤n → n. 0..<n → n. 1..<n → n−1. Subtract d while d ≤ n → n/d."],
      ["Max / min ops", "Max: the inputs that run the most lines. Min: skip every IF body you can. An IF/ELSE always runs one side."],
      ["Java program", "public class Name { public static void main(String[] args) { … } }. The file must be Name.java (case-sensitive)."],
      ["Commands", "javac Name.java → Name.class. java Name 5 10. Missing args → ArrayIndexOutOfBoundsException."],
      ["Types", "int 6 · double 3.498 · boolean true · char 'a' · String \"hello\". A double can't go into an int (compile error)."],
      ["Random", "(int)(Math.random() * (max − min + 1)) + min. Math.random() is in [0, 1)."],
      ["Loops", "for: init once → check → body → update → check… The loop variable's last value is the one that fails the check (i = 5 in 1..<5)."],
      ["if chains", "else-if runs only the first true block. Separate ifs can all run. A chain without else can print nothing."],
      ["Errors", "Compile: missing ; or }, undeclared variable, wrong type, variable used before it has a value, curly quotes. Run-time: missing args, parseInt(\"hi\"), int ÷ 0. A wrong main line compiles but won't start. Logic: < vs <=, int division, ; after for, a + b / 2, missing i++."]
    ].map(function (r) { return '<div class="rule"><h4>' + esc(r[0]) + "</h4><p>" + esc(r[1]) + "</p></div>"; }).join("") + "</div>";
    main.appendChild(c);
  }

  /* ---------- Tutor chat ---------- */
  function tutorContext() {
    if (view.name !== "lesson") return "The student is on the " + view.name + " page.";
    var L = LESSONS[view.li], st = L.steps[view.si];
    var t = "Lesson " + (view.li + 1) + ": " + L.title + ". Card: " + (st.h || "") + " " + strip(st.p || st.html || "").slice(0, 1500);
    if (st.code) t += "\nCode:\n" + st.code;
    if (st.t === "jtrace") t += "\nJava code:\n" + JAVA.P[st.key].code;
    if (st.t === "write") { var ta = $(".editor"); if (ta) t += "\nThe student's current pseudocode:\n" + ta.value; }
    return t;
  }
  var history = [], chatCtl = null;
  function initTutor() {
    var btn = $("#tutorBtn"), panel = $("#tutor"), log = $("#tlog"), f = $("#tform"), ta = $("#tin");
    btn.onclick = function () { panel.hidden = !panel.hidden; if (!panel.hidden) ta.focus(); };
    $("#tclose").onclick = function () { panel.hidden = true; };
    ta.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); f.requestSubmit ? f.requestSubmit() : f.onsubmit(e); } });
    f.onsubmit = function (e) {
      e.preventDefault(); var q = ta.value.trim(); if (!q || !AI) return; ta.value = "";
      log.appendChild(el("div", "msg me")).textContent = q;
      var a = el("div", "msg bot thinking"); a.textContent = "Thinking…"; log.appendChild(a); log.scrollTop = log.scrollHeight;
      history.push({ role: "user", content: q }); if (history.length > 12) history = history.slice(-12);
      while (history.length && history[0].role !== "user") history.shift();
      chatCtl = new AbortController();
      AI([{ role: "user", content: RULES + "\n\nWhat the student is looking at right now:\n" + tutorContext() }].concat(history), { cache: false, signal: chatCtl.signal, onText: function (u) { a.classList.remove("thinking"); a.textContent = u.text; log.scrollTop = log.scrollHeight; } })
        .then(function (r) { history.push({ role: "assistant", content: r.text }); })
        .catch(function (err) { a.classList.remove("thinking"); aiFail(err, a); history.pop(); });
    };
  }

  /* ---------- boot ---------- */
  function boot() {
    main = $("#main"); side = $("#side");
    $("#lessonSel").onchange = function (e) { var v = e.target.value; if (v === "home") go({ name: "home" }); else if (v === "cheat") go({ name: "cheat" }); else go({ name: "lesson", li: +v, si: resumeStep(+v) }); };
    side.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; if (b.dataset.v) go({ name: b.dataset.v }); else if (b.dataset.li != null) go({ name: "lesson", li: +b.dataset.li, si: resumeStep(+b.dataset.li) }); });
    $("#homeBtn").onclick = function () { go({ name: "home" }); };
    $("#cd").textContent = countdown(); setInterval(function () { $("#cd").textContent = countdown(); }, 30000);
    initAI(); initTutor();
    refreshProgress(); render();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
